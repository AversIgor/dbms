<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Схема — migrate</title>
  <style>
    :root {
      --bg: #f4f1ea;
      --ink: #1c241c;
      --muted: #5c6758;
      --card: #fffdf8;
      --line: #d5d0c4;
      --ok: #2f6b3a;
      --ok-bg: #e4f0e4;
      --bad: #8b2e2e;
      --bad-bg: #f6e4e4;
      --wait: #6b5a2f;
      --wait-bg: #f3ecd8;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font: 16px/1.45 "Segoe UI", system-ui, sans-serif;
      color: var(--ink);
      background: var(--bg);
    }
    header {
      padding: 1.25rem 1.5rem;
      border-bottom: 1px solid var(--line);
      background: var(--card);
    }
    h1 { margin: 0; font-size: 1.15rem; font-weight: 650; }
    header p { margin: 0.25rem 0 0; color: var(--muted); font-size: 0.9rem; }
    main { padding: 1.5rem; max-width: 52rem; }
    .grid { display: grid; gap: 0.75rem; grid-template-columns: repeat(auto-fill, minmax(14rem, 1fr)); }
    article {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 0.9rem 1rem;
    }
    article h2 {
      margin: 0 0 0.4rem;
      font-size: 0.75rem;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--muted);
      font-weight: 600;
    }
    .value { font-size: 1.05rem; word-break: break-all; }
    .pill {
      display: inline-block;
      padding: 0.1rem 0.5rem;
      border-radius: 999px;
      font-size: 0.9rem;
    }
    .ok { background: var(--ok-bg); color: var(--ok); }
    .bad { background: var(--bad-bg); color: var(--bad); }
    .wait { background: var(--wait-bg); color: var(--wait); }
    pre {
      margin: 1.25rem 0 0;
      padding: 0.9rem 1rem;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 8px;
      overflow: auto;
      font-size: 0.8rem;
    }
    .note { margin-top: 1rem; color: var(--muted); font-size: 0.85rem; }
    .report {
      margin: 1.5rem 0 0.5rem;
      font-size: 0.75rem;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--muted);
    }
    #history {
      margin: 0;
      padding: 0.9rem 1rem 0.9rem 1.5rem;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 8px;
    }
  </style>
</head>
<body>
  <header>
    <h1>Схема</h1>
    <p>Только чтение. Миграции — CLI / Compose, не из браузера.</p>
  </header>
  <main>
    <div class="grid">
      <article>
        <h2>Процесс</h2>
        <div class="value" id="process">…</div>
      </article>
      <article>
        <h2>БД</h2>
        <div class="value" id="database">…</div>
      </article>
      <article>
        <h2>Схема</h2>
        <div class="value" id="schema">…</div>
      </article>
      <article>
        <h2>PostGIS</h2>
        <div class="value" id="postgis">…</div>
      </article>
      <article>
        <h2>Последний upgrade</h2>
        <div class="value" id="upgrade">…</div>
      </article>
    </div>
    <p class="note" id="error"></p>
    <h2 class="report">History</h2>
    <ul id="history"></ul>
    <pre id="raw"></pre>
  </main>
  <script>
    function pill(ok, yes, no) {
      const cls = ok ? "ok" : "bad";
      const text = ok ? yes : no;
      return `<span class="pill ${cls}">${text}</span>`;
    }
    async function refresh() {
      let healthOk = false;
      try {
        const h = await fetch("/health");
        healthOk = h.ok;
      } catch (e) {
        healthOk = false;
      }
      document.getElementById("process").innerHTML = pill(healthOk, "жив", "нет");
      try {
        const r = await fetch("/status");
        const s = await r.json();
        document.getElementById("database").innerHTML = pill(s.database, "доступна", "нет");
        const sync = s.in_sync && s.revision;
        document.getElementById("schema").innerHTML =
          (sync ? pill(true, "совпадает", "") : pill(false, "", "не head")) +
          `<div style="margin-top:.4rem;font-size:.85rem;color:var(--muted)">revision ${s.revision || "—"}<br>head ${s.head || "—"}</div>`;
        document.getElementById("postgis").innerHTML = pill(s.postgis, "да", "нет");
        const u = s.last_upgrade || {};
        let uhtml;
        if (u.ok === true) uhtml = pill(true, "ок", "");
        else if (u.ok === false) uhtml = pill(false, "", "ошибка");
        else uhtml = `<span class="pill wait">не в этом процессе</span>`;
        document.getElementById("upgrade").innerHTML =
          uhtml + `<div style="margin-top:.4rem;font-size:.85rem;color:var(--muted)">${u.message || ""}<br>${u.at || ""}</div>`;
        document.getElementById("error").textContent = s.error || "";
        const hist = document.getElementById("history");
        hist.innerHTML = (s.history || []).map(
          (row) => `<li><code>${row.revision}</code> — ${row.message || ""}</li>`
        ).join("") || "<li>нет revision</li>";
        document.getElementById("raw").textContent = JSON.stringify(s, null, 2);
      } catch (e) {
        document.getElementById("error").textContent = String(e);
      }
    }
    refresh();
    setInterval(refresh, 5000);
  </script>
</body>
</html>
