<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Разделы — admin</title>
  <style>
    :root {
      --bg: #ececec;
      --ink: #1a1a1a;
      --muted: #6a6a6a;
      --card: #ffffff;
      --line: #b8b8b8;
      --bar: #ffc000;
      --bar-edge: #e0a800;
      --cmd: #f3f3f3;
      --ok: #2d6a32;
      --ok-bg: #e3f0d8;
      --bad: #a33;
      --bad-bg: #f5d6d6;
      --wait: #7a5c12;
      --wait-bg: #ffe9a8;
      --sel: #fff4c2;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      font: 13px/1.35 Tahoma, "Segoe UI", sans-serif;
      color: var(--ink);
      background: var(--bg);
    }
    .shell { display: flex; flex-direction: column; height: 100%; }
    .taxi-bar {
      display: flex;
      align-items: baseline;
      gap: 0.75rem;
      padding: 0.35rem 0.7rem 0.4rem;
      background: linear-gradient(#ffd54a, var(--bar));
      border-bottom: 1px solid var(--bar-edge);
    }
    h1 { margin: 0; font-size: 14px; font-weight: 700; }
    .taxi-bar p { margin: 0; color: #5a4a10; font-size: 12px; }
    .taxi-cmd {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 3px 6px;
      background: var(--cmd);
      border-bottom: 1px solid var(--line);
      min-height: 28px;
    }
    .taxi-cmd span { color: var(--muted); font-size: 12px; }
    .workspace { display: flex; flex: 1; min-height: 0; }
    nav.nav {
      width: 220px;
      flex-shrink: 0;
      background: var(--card);
      border-right: 1px solid var(--line);
      overflow: auto;
    }
    nav.nav button {
      display: block;
      width: 100%;
      text-align: left;
      border: 0;
      border-bottom: 1px solid #e8e8e8;
      background: transparent;
      padding: 7px 10px;
      border-radius: 0;
    }
    nav.nav button.on {
      background: var(--sel);
      box-shadow: inset 3px 0 0 var(--bar-edge);
      font-weight: 700;
    }
    main { flex: 1; overflow: auto; padding: 0; background: var(--bg); }
    section.card {
      background: var(--card);
      border: 0;
      min-height: 100%;
    }
    section.card h2 {
      margin: 0;
      padding: 6px 10px;
      font-size: 13px;
      font-weight: 700;
      background: linear-gradient(#ffe27a, var(--bar));
      border-bottom: 1px solid var(--bar-edge);
    }
    .card-body { padding: 8px 10px 12px; }
    .pill {
      display: inline-block;
      padding: 0 5px;
      margin-left: 0.4rem;
      font-size: 11px;
      font-weight: 400;
      border: 1px solid var(--line);
      background: var(--cmd);
    }
    .ok { background: var(--ok-bg); color: var(--ok); border-color: #9cba7a; }
    .bad { background: var(--bad-bg); color: var(--bad); border-color: #d09090; }
    .wait { background: var(--wait-bg); color: var(--wait); border-color: var(--bar-edge); }
    .row { display: flex; flex-wrap: wrap; gap: 6px; align-items: end; margin: 6px 0; }
    label { font-size: 12px; color: var(--muted); display: flex; flex-direction: column; gap: 2px; }
    label.check { flex-direction: row; align-items: center; gap: 0.35rem; white-space: nowrap; color: var(--ink); }
    input, button, select {
      font: inherit;
      padding: 2px 7px;
      border: 1px solid #8f8f8f;
      border-radius: 0;
      background: var(--card);
    }
    button {
      cursor: pointer;
      background: linear-gradient(#fafafa, #e6e6e6);
    }
    button:hover:not(:disabled) { background: linear-gradient(#fff, #eee); }
    button:disabled { cursor: default; opacity: 0.45; }
    table { border-collapse: collapse; width: 100%; font-size: 12px; margin-top: 4px; }
    th, td {
      border: 1px solid #c9c9c9;
      padding: 2px 6px;
      text-align: left;
      vertical-align: top;
      word-break: break-word;
      white-space: pre-wrap;
    }
    th { background: #f4f4f4; font-weight: 700; }
    tbody tr:nth-child(even) { background: #fafafa; }
    tbody tr:hover { background: #fff8dc; }
    span.result { max-width: 42rem; word-break: break-word; }
    tr.running { background: var(--sel) !important; }
    .pager { display: flex; align-items: center; gap: 4px; }
    pre {
      margin: 0.5rem 0 0;
      padding: 6px 8px;
      background: var(--bg);
      border: 1px solid var(--line);
      overflow: auto;
      font-size: 11px;
      max-height: 16rem;
    }
    .muted { color: var(--muted); font-size: 12px; }
    .block { margin-top: 10px; }
    .block h3 {
      margin: 0 0 4px;
      font-size: 12px;
      font-weight: 700;
      color: var(--ink);
      border-bottom: 1px solid var(--line);
      padding-bottom: 2px;
    }
    dialog.browser {
      width: min(96vw, 76rem);
      max-height: 92vh;
      border: 1px solid #7a7a7a;
      padding: 0;
      background: var(--card);
      color: var(--ink);
    }
    dialog.browser::backdrop { background: rgba(40, 40, 40, 0.35); }
    .browser-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.75rem;
      padding: 5px 8px;
      background: linear-gradient(#ffe27a, var(--bar));
      border-bottom: 1px solid var(--bar-edge);
    }
    .browser-head h3 { margin: 0; font-size: 13px; color: var(--ink); }
    .browser-form, .browser > .row { padding: 6px 8px; margin: 0; }
    .browser-table-wrap { overflow: auto; max-height: 52vh; margin: 0 8px 8px; }
    .browser-table-wrap table { margin-top: 0; }
    th.check, td.check { width: 2rem; text-align: center; }
    footer.taxi-status {
      padding: 2px 8px;
      font-size: 12px;
      background: var(--cmd);
      border-top: 1px solid var(--line);
      color: var(--muted);
    }
  </style>
</head>
<body>
  <div class="shell">
    <header class="taxi-bar">
      <h1>Разделы системы</h1>
      <p>Витрина HTTP процессов</p>
    </header>
    <div class="taxi-cmd"><span>Разделы</span></div>
    <div class="workspace">
      <nav id="nav" class="nav"></nav>
      <main id="root"></main>
    </div>
    <footer class="taxi-status">Готово</footer>
  </div>
  <script>
    const root = document.getElementById("root");
    const nav = document.getElementById("nav");

    function setActive(id) {
      document.querySelectorAll("#nav button").forEach((b) => {
        b.classList.toggle("on", b.dataset.id === id);
      });
      document.querySelectorAll("#root > .card").forEach((el) => {
        el.hidden = el.dataset.id !== id;
      });
    }

    function pill(ok, text) {
      const cls = ok === true ? "ok" : ok === false ? "bad" : "wait";
      return `<span class="pill ${cls}">${esc(text)}</span>`;
    }

    function esc(value) {
      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function fieldInput(field) {
      const name = esc(field.name);
      const req = field.optional ? "" : "required";
      if (field.type === "checkbox") {
        const v = esc(field.value != null && field.value !== "" ? field.value : "1");
        const checked = field.checked ? "checked" : "";
        return `<label class="check"><input name="${name}" type="checkbox" value="${v}" ${checked}> ${esc(field.label || field.name)}</label>`;
      }
      if (field.type === "select") {
        const opts = (field.options || []).map((opt) => {
          const v = typeof opt === "object" ? opt.value : opt;
          const lab = typeof opt === "object" ? (opt.label || v) : opt;
          const sel = String(field.value ?? "") === String(v) ? "selected" : "";
          return `<option value="${esc(v)}" ${sel}>${esc(lab)}</option>`;
        }).join("");
        return `<label>${esc(field.label || field.name)}<select name="${name}" ${req}>${opts}</select></label>`;
      }
      const type = field.type === "date" ? "date" : field.type === "int" ? "number" : "text";
      const val = field.value != null && field.value !== "" ? `value="${esc(field.value)}"` : "";
      return `<label>${esc(field.label || field.name)}<input name="${name}" type="${type}" ${val} ${req}></label>`;
    }

    function cellText(col, row) {
      const val = row[col.name];
      if (typeof val === "boolean") return val ? "да" : "";
      if (val && typeof val === "object") return JSON.stringify(val);
      return val;
    }

    function tableHtml(rows, columns, highlight, options) {
      if (!rows || !rows.length) return `<p class="muted">пусто</p>`;
      const cols = columns && columns.length
        ? columns
        : Object.keys(rows[0]).map((k) => ({ name: k, label: k }));
      const idField = options && options.idField;
      const selectable = Boolean(idField);
      const head = (selectable ? `<th class="check"><input type="checkbox" class="pick-all"></th>` : "") +
        cols.map((c) => `<th>${esc(c.label || c.name)}</th>`).join("");
      const field = highlight && highlight.field;
      const cls = (highlight && highlight.class) || "running";
      const body = rows.map((row) => {
        const on = field ? Boolean(row[field]) : false;
        const id = idField ? row[idField] : "";
        const pick = selectable
          ? `<td class="check"><input type="checkbox" class="pick" value="${esc(id)}"></td>`
          : "";
        const cells = cols.map((c) => `<td>${esc(cellText(c, row))}</td>`).join("");
        return `<tr class="${on ? esc(cls) : ""}">${pick}${cells}</tr>`;
      }).join("");
      return `<table><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table>`;
    }

    async function fetchJson(url, options) {
      const res = await fetch(url, options);
      const text = await res.text();
      let data;
      try { data = text ? JSON.parse(text) : null; } catch { data = { raw: text }; }
      return { ok: res.ok, status: res.status, data };
    }

    function buildQuery(action, form) {
      const params = new URLSearchParams();
      const query = action.query || {};
      Object.keys(query).forEach((k) => params.set(k, query[k]));
      (action.fields || []).forEach((field) => {
        const input = form.elements[field.name];
        if (field.type === "checkbox") {
          params.set(field.name, input && input.checked ? (input.value || "1") : "0");
          return;
        }
        const value = input ? String(input.value || "").trim() : "";
        if (value) params.set(field.name, value);
      });
      const qs = params.toString();
      return qs ? `${action.path}?${qs}` : action.path;
    }

    function renderStub(section) {
      const el = document.createElement("section");
      el.className = "card";
      el.dataset.id = section.id;
      el.innerHTML = `<h2>${esc(section.title)} ${pill(null, "нет HTTP")}</h2>
        <div class="card-body"><p class="muted">${esc(section.stub || "")}</p></div>`;
      return el;
    }

    function renderCard(section) {
      const el = document.createElement("section");
      el.className = "card";
      el.dataset.id = section.id;
      el.innerHTML = `<h2>${esc(section.title)} ${pill(null, "…")}</h2>
        <div class="card-body">
          <div class="status muted">загрузка</div>
          <div class="actions block"></div>
          <div class="tables block"></div>
        </div>`;
      return el;
    }

    function statusQuery(panel, form) {
      const params = new URLSearchParams();
      const spec = panel.status || {};
      (spec.filters || []).forEach((field) => {
        const input = form && form.elements[field.name];
        const value = input ? String(input.value || "").trim() : "";
        if (value) params.set(field.name, value);
      });
      const pag = spec.pagination;
      if (pag && form && form.elements[pag.param]) {
        const value = String(form.elements[pag.param].value || "").trim();
        if (value) params.set(pag.param, value);
      }
      return params.toString();
    }

    function mountStatus(card, sectionId, panel) {
      const spec = panel.status || {};
      if (!spec.columns) return;
      const box = card.querySelector(".status");
      const pag = spec.pagination;
      const pager = pag
        ? `<div class="pager">
             <button type="button" class="prev-day" disabled>←</button>
             <input type="date" name="${esc(pag.param)}">
             <button type="button" class="next-day" disabled>→</button>
           </div>`
        : "";
      box.classList.remove("muted");
      box.innerHTML = `<form class="status-filters row">${(spec.filters || []).map(fieldInput).join("")}
        ${pager}<button type="submit">Показать</button></form>
        <div class="status-table muted">загрузка</div>`;
      const form = box.querySelector("form");
      form.addEventListener("submit", (ev) => {
        ev.preventDefault();
        refreshStatus(card, sectionId, panel);
      });
      if (!pag) return;
      form.querySelector(".prev-day").addEventListener("click", () => {
        if (!form.dataset.prev) return;
        form.elements[pag.param].value = form.dataset.prev;
        refreshStatus(card, sectionId, panel);
      });
      form.querySelector(".next-day").addEventListener("click", () => {
        if (!form.dataset.next) return;
        form.elements[pag.param].value = form.dataset.next;
        refreshStatus(card, sectionId, panel);
      });
    }

    async function refreshStatus(card, sectionId, panel) {
      const spec = panel.status || {};
      const path = spec.path || "/status";
      const box = card.querySelector(".status");
      const title = card.querySelector("h2");
      const form = card.querySelector(".status-filters");
      const qs = spec.columns ? statusQuery(panel, form) : "";
      const res = await fetchJson(`/p/${sectionId}${path}${qs ? "?" + qs : ""}`);
      const ok = res.ok;
      title.innerHTML = `${esc(card.dataset.title || sectionId)} ${pill(ok, ok ? "жив" : "нет")} `;
      if (spec.columns) {
        const rowsKey = spec.rows || "subjects";
        const rows = res.data && Array.isArray(res.data[rowsKey]) ? res.data[rowsKey] : [];
        const tableBox = card.querySelector(".status-table");
        if (tableBox) {
          tableBox.classList.remove("muted");
          tableBox.innerHTML = ok ? tableHtml(rows, spec.columns, spec.highlight)
            : `<p class="muted">процесс недоступен</p>`;
        }
        const pag = spec.pagination;
        if (form && pag && res.data) {
          const cur = res.data[pag.current];
          const dayInput = form.elements[pag.param];
          if (cur && dayInput && document.activeElement !== dayInput) {
            dayInput.value = cur;
          }
          form.dataset.prev = res.data[pag.prev] || "";
          form.dataset.next = res.data[pag.next] || "";
          const prevBtn = form.querySelector(".prev-day");
          const nextBtn = form.querySelector(".next-day");
          if (prevBtn) prevBtn.disabled = !form.dataset.prev;
          if (nextBtn) nextBtn.disabled = !form.dataset.next;
        }
        return;
      }
      if (res.data && Array.isArray(res.data.subjects) && res.data.subjects.length) {
        box.innerHTML = tableHtml(res.data.subjects);
      } else if (res.data && res.data.revision) {
        const num = String(res.data.revision).split("_")[0];
        const label = spec.label || "Версия СУБД";
        box.innerHTML = `<p class="muted">${esc(`${label}: ${num}`)}</p>`;
      } else if (res.data && Array.isArray(res.data.history) && res.data.history.length) {
        const rows = res.data.history.map((item) =>
          typeof item === "object" ? item : { revision: item }
        );
        box.innerHTML = tableHtml(rows);
      } else {
        box.innerHTML = `<pre>${esc(JSON.stringify(res.data, null, 2))}</pre>`;
      }
    }

    function mountActions(card, sectionId, panel) {
      const wrap = card.querySelector(".actions");
      if (!panel.actions || !panel.actions.length) {
        wrap.innerHTML = "";
        return;
      }
      wrap.innerHTML = `<h3>Команды</h3>`;
      panel.actions.forEach((action) => {
        const form = document.createElement("form");
        form.className = "row";
        form.innerHTML = (action.fields || []).map(fieldInput).join("") +
          `<button type="submit">${esc(action.title || action.id)}</button>
           <span class="muted result"></span>`;
        form.addEventListener("submit", async (ev) => {
          ev.preventDefault();
          const result = form.querySelector(".result");
          const rel = buildQuery(action, form);
          const method = (action.method || "GET").toUpperCase();
          result.textContent = "…";
          const res = await fetchJson(`/p/${sectionId}${rel}`, { method });
          if (res.ok) {
            result.textContent = `ok ${res.status}`;
          } else {
            const err = res.data && (res.data.error || res.data.detail);
            const text = typeof err === "string" ? err : err ? JSON.stringify(err) : "";
            result.textContent = text
              ? `ошибка ${res.status}: ${text}`
              : `ошибка ${res.status}`;
          }
          refreshStatus(card, sectionId, panel);
        });
        wrap.appendChild(form);
      });
    }

    function errorText(res) {
      const err = res.data && (res.data.error || res.data.detail);
      const text = typeof err === "string" ? err : err ? JSON.stringify(err) : "";
      return text ? `ошибка ${res.status}: ${text}` : `ошибка ${res.status}`;
    }

    function mountTableBrowser(wrap, sectionId, table) {
      const block = document.createElement("div");
      const openLabel = table.open_label || table.title || "Открыть";
      block.innerHTML = `<h3>${esc(table.title || table.id)}</h3>
        <button type="button" class="open-browser">${esc(openLabel)}</button>`;
      const dlg = document.createElement("dialog");
      dlg.className = "browser";
      const tableParam = table.table_param || "table";
      const fieldParam = table.search_field_param || "field";
      const qParam = table.search_value_param || "q";
      const pageParam = table.page_param || "page";
      const sizeParam = table.size_param || "size";
      const tableOpts = (table.tables || []).map((opt) => {
        const v = typeof opt === "object" ? opt.value : opt;
        const lab = typeof opt === "object" ? (opt.label || v) : opt;
        return `<option value="${esc(v)}">${esc(lab)}</option>`;
      }).join("");
      dlg.innerHTML = `<div class="browser-head">
          <h3>${esc(table.title || table.id)}</h3>
          <button type="button" class="close-browser">Закрыть</button>
        </div>
        <form class="row browser-form">
          <label>${esc(table.table_label || "Таблица")}
            <select name="${esc(tableParam)}" required>
              <option value="">выберите</option>${tableOpts}
            </select>
          </label>
          <label>Поиск по
            <select name="${esc(fieldParam)}"></select>
          </label>
          <label>Значение
            <input name="${esc(qParam)}" type="text">
          </label>
          <input type="hidden" name="${esc(pageParam)}" value="1">
          <label>На странице
            <input name="${esc(sizeParam)}" type="number" value="50" min="1" max="100">
          </label>
          <button type="submit">Показать</button>
          <button type="button" class="prev-page" disabled>←</button>
          <button type="button" class="next-page" disabled>→</button>
          <span class="muted page-info"></span>
        </form>
        <div class="row">
          <button type="button" class="del-selected" disabled>Удалить выбранные</button>
          <button type="button" class="del-matching" disabled>Удалить найденные</button>
          <span class="muted result"></span>
        </div>
        <div class="browser-table-wrap muted">выберите таблицу</div>`;
      block.appendChild(dlg);
      wrap.appendChild(block);

      const form = dlg.querySelector("form");
      const out = dlg.querySelector(".browser-table-wrap");
      const result = dlg.querySelector(".result");
      const fieldSelect = form.elements[fieldParam];
      const state = { total: 0, pages: 1, idField: "", loaded: false };

      function fillFields(fields, current) {
        const opts = (fields || []).map((col) => {
          const name = col.name || col;
          const lab = col.label || name;
          const sel = String(current || "") === String(name) ? "selected" : "";
          return `<option value="${esc(name)}" ${sel}>${esc(lab)}</option>`;
        }).join("");
        fieldSelect.innerHTML = opts;
      }

      function syncPager() {
        const page = Number(form.elements[pageParam].value || 1);
        dlg.querySelector(".prev-page").disabled = !state.loaded || page <= 1;
        dlg.querySelector(".next-page").disabled = !state.loaded || page >= state.pages;
        dlg.querySelector(".page-info").textContent = state.loaded
          ? `${page} / ${state.pages}, всего ${state.total}`
          : "";
        const q = String(form.elements[qParam].value || "").trim();
        dlg.querySelector(".del-matching").disabled = !state.loaded || !q || !state.total;
        dlg.querySelector(".del-selected").disabled = true;
      }

      function bindPicks() {
        const all = out.querySelector(".pick-all");
        const picks = () => [...out.querySelectorAll(".pick")];
        const refreshDel = () => {
          dlg.querySelector(".del-selected").disabled = !picks().some((el) => el.checked);
        };
        if (all) {
          all.addEventListener("change", () => {
            picks().forEach((el) => { el.checked = all.checked; });
            refreshDel();
          });
        }
        picks().forEach((el) => el.addEventListener("change", refreshDel));
        refreshDel();
      }

      async function load() {
        const tableName = String(form.elements[tableParam].value || "").trim();
        if (!tableName) {
          result.textContent = "выберите таблицу";
          return;
        }
        const params = new URLSearchParams();
        params.set(tableParam, tableName);
        const field = String(form.elements[fieldParam].value || "").trim();
        const q = String(form.elements[qParam].value || "").trim();
        if (q) {
          if (field) params.set(fieldParam, field);
          params.set(qParam, q);
        }
        params.set(pageParam, String(form.elements[pageParam].value || "1"));
        params.set(sizeParam, String(form.elements[sizeParam].value || "50"));
        out.classList.add("muted");
        out.textContent = "загрузка";
        const res = await fetchJson(`/p/${sectionId}${table.path}?${params}`);
        if (!res.ok) {
          state.loaded = false;
          out.textContent = errorText(res);
          syncPager();
          return;
        }
        const data = res.data || {};
        fillFields(data.search_fields || data.columns, data.field || field);
        state.total = Number(data.total || 0);
        state.pages = Number(data.pages || 1);
        state.idField = data.id_field || "";
        state.loaded = true;
        if (data.page) form.elements[pageParam].value = data.page;
        out.classList.remove("muted");
        out.innerHTML = tableHtml(data.rows || [], data.columns, null, { idField: state.idField });
        bindPicks();
        syncPager();
        result.textContent = "";
      }

      async function sendDelete(payload) {
        const spec = table.delete || {};
        const path = spec.path || `${table.path}/delete`;
        const method = (spec.method || "POST").toUpperCase();
        result.textContent = "…";
        const res = await fetchJson(`/p/${sectionId}${path}`, {
          method,
          headers: { "content-type": "application/json" },
          body: JSON.stringify(payload),
        });
        if (!res.ok) {
          result.textContent = errorText(res);
          return;
        }
        const n = res.data && res.data.deleted != null ? res.data.deleted : "";
        result.textContent = n === "" ? `ok ${res.status}` : `удалено ${n}`;
        await load();
      }

      block.querySelector(".open-browser").addEventListener("click", () => dlg.showModal());
      dlg.querySelector(".close-browser").addEventListener("click", () => dlg.close());
      form.addEventListener("submit", (ev) => {
        ev.preventDefault();
        form.elements[pageParam].value = "1";
        load();
      });
      form.elements[tableParam].addEventListener("change", () => {
        fillFields([]);
        form.elements[pageParam].value = "1";
        form.elements[qParam].value = "";
        load();
      });
      dlg.querySelector(".prev-page").addEventListener("click", () => {
        const page = Math.max(1, Number(form.elements[pageParam].value || 1) - 1);
        form.elements[pageParam].value = String(page);
        load();
      });
      dlg.querySelector(".next-page").addEventListener("click", () => {
        const page = Number(form.elements[pageParam].value || 1) + 1;
        form.elements[pageParam].value = String(page);
        load();
      });
      dlg.querySelector(".del-selected").addEventListener("click", () => {
        const ids = [...out.querySelectorAll(".pick:checked")].map((el) => el.value);
        if (!ids.length) return;
        if (!window.confirm(`Удалить выбранные записи (${ids.length})?`)) return;
        sendDelete({ table: form.elements[tableParam].value, ids });
      });
      dlg.querySelector(".del-matching").addEventListener("click", () => {
        const q = String(form.elements[qParam].value || "").trim();
        if (!q || !state.total) return;
        if (!window.confirm(`Удалить все найденные записи (${state.total})?`)) return;
        sendDelete({
          table: form.elements[tableParam].value,
          field: form.elements[fieldParam].value,
          q,
          all_matching: true,
        });
      });
    }

    function mountTables(card, sectionId, panel) {
      const wrap = card.querySelector(".tables");
      if (!panel.tables || !panel.tables.length) {
        wrap.innerHTML = "";
        return;
      }
      wrap.innerHTML = "";
      panel.tables.forEach((table) => {
        if (table.kind === "browser") {
          mountTableBrowser(wrap, sectionId, table);
          return;
        }
        const block = document.createElement("div");
        const heading = table.title ? `<h3>${esc(table.title)}</h3>` : "";
        block.innerHTML = heading;
        const form = document.createElement("form");
        form.className = "row";
        form.innerHTML = (table.fields || []).map(fieldInput).join("") +
          `<button type="submit">Показать: ${esc(table.title || table.id)}</button>`;
        const out = document.createElement("div");
        form.addEventListener("submit", async (ev) => {
          ev.preventDefault();
          const params = new URLSearchParams();
          (table.fields || []).forEach((field) => {
            const input = form.elements[field.name];
            const value = input ? String(input.value || "").trim() : "";
            if (value) params.set(field.name, value);
          });
          const qs = params.toString();
          const url = `/p/${sectionId}${table.path}${qs ? "?" + qs : ""}`;
          const res = await fetchJson(url);
          const rows = res.data && res.data.rows ? res.data.rows : (Array.isArray(res.data) ? res.data : []);
          out.innerHTML = tableHtml(rows);
        });
        block.appendChild(form);
        block.appendChild(out);
        wrap.appendChild(block);
      });
    }

    async function boot() {
      const cat = await fetchJson("/catalog");
      const sections = (cat.data && cat.data.sections) || [];
      nav.innerHTML = "";
      root.innerHTML = "";
      let firstId = null;
      for (const section of sections) {
        if (!firstId) firstId = section.id;
        const item = document.createElement("button");
        item.type = "button";
        item.dataset.id = section.id;
        item.textContent = section.title;
        item.addEventListener("click", () => setActive(section.id));
        nav.appendChild(item);
        if (!section.has_http) {
          root.appendChild(renderStub(section));
          continue;
        }
        const card = renderCard(section);
        card.dataset.title = section.title;
        root.appendChild(card);
        const panelRes = await fetchJson(`/p/${section.id}/panel`);
        if (!panelRes.ok || !panelRes.data) {
          card.querySelector("h2").innerHTML =
            `${esc(section.title)} ${pill(false, "нет")}`;
          card.querySelector(".status").textContent = "процесс недоступен";
          continue;
        }
        const panel = panelRes.data;
        mountActions(card, section.id, panel);
        mountStatus(card, section.id, panel);
        mountTables(card, section.id, panel);
        await refreshStatus(card, section.id, panel);
        setInterval(() => refreshStatus(card, section.id, panel), 5000);
      }
      if (firstId) setActive(firstId);
    }

    boot();
  </script>
</body>
</html>
