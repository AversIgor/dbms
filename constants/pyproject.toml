[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "constants"
version = "0.1.0"
description = "Типизированные прикладные настройки"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "click>=8.1",
    "python-dotenv>=1.0",
]

[project.scripts]
constants = "constants.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
